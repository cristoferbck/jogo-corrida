<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Forca - 10 Níveis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>🎯 Jogo da Forca</h1>
            <p>Descubra a palavra antes que a forca seja completada!</p>
        </header>

        <!-- INFORMAÇÕES -->

        <section class="status">

            <div class="status-box">
                <small>Nível</small>
                <strong id="level">1/10</strong>
            </div>

            <div class="status-box">
                <small>Pontos</small>
                <strong id="score">0</strong>
            </div>

            <div class="status-box">
                <small>Erros</small>
                <strong id="errors">0/6</strong>
            </div>

        </section>

        <!-- PROGRESSO -->

        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <section id="game">

            <!-- FORCA -->

            <div class="hangman-container">

                <svg
                    class="hangman"
                    viewBox="0 0 300 320"
                    aria-label="Desenho da forca"
                >

                    <!-- Estrutura -->

                    <line class="draw"
                        x1="40" y1="290"
                        x2="250" y2="290"/>

                    <line class="draw"
                        x1="90" y1="290"
                        x2="90" y2="30"/>

                    <line class="draw"
                        x1="90" y1="30"
                        x2="210" y2="30"/>

                    <line class="draw"
                        x1="210" y1="30"
                        x2="210" y2="70"/>

                    <!-- Cabeça -->

                    <circle
                        id="part1"
                        class="draw body-part"
                        cx="210"
                        cy="105"
                        r="35"
                    />

                    <!-- Corpo -->

                    <line
                        id="part2"
                        class="draw body-part"
                        x1="210"
                        y1="140"
                        x2="210"
                        y2="220"
                    />

                    <!-- Braço esquerdo -->

                    <line
                        id="part3"
                        class="draw body-part"
                        x1="210"
                        y1="155"
                        x2="165"
                        y2="190"
                    />

                    <!-- Braço direito -->

                    <line
                        id="part4"
                        class="draw body-part"
                        x1="210"
                        y1="155"
                        x2="255"
                        y2="190"
                    />

                    <!-- Perna esquerda -->

                    <line
                        id="part5"
                        class="draw body-part"
                        x1="210"
                        y1="220"
                        x2="165"
                        y2="270"
                    />

                    <!-- Perna direita -->

                    <line
                        id="part6"
                        class="draw body-part"
                        x1="210"
                        y1="220"
                        x2="255"
                        y2="270"
                    />

                </svg>

            </div>

            <!-- ÁREA DO JOGO -->

            <div class="game-area">

                <div class="category">
                    Categoria:
                    <strong id="category">Animais</strong>
                </div>

                <div id="word" class="word"></div>

                <div id="message" class="message">
                    Escolha uma letra!
                </div>

                <div id="keyboard" class="keyboard"></div>

                <button
                    id="nextButton"
                    class="action-button hidden"
                >
                    Próximo nível ➡️
                </button>

            </div>

        </section>

        <!-- TELA FINAL -->

        <section id="endScreen" class="hidden">

            <div class="final-icon">🏆</div>

            <h2>Parabéns!</h2>

            <p>Você completou os 10 níveis!</p>

            <div id="finalScore"></div>

            <button
                id="restartButton"
                class="action-button"
            >
                🔄 Jogar novamente
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
